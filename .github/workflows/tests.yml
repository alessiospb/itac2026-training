name: UI tests
on:
  push:
    # Documentation-only commits do not start a run, so they do not replace the published series.
    paths-ignore: ['**.md', 'docs/**', 'evidence/**', 'video/**']
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit
      # No continue-on-error: a failing test must turn the run red.
      - run: npx playwright test --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Publishes to GitHub Pages an index of every main run of this commit (the five-run series),
  # each linked to its own HTML report. Red runs are published too: that is when they are needed most.
  # The workflow result is still decided by the tests job.
  deploy-report:
    needs: tests
    if: always() && needs.tests.result != 'cancelled' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        # Missing when the tests job failed before Playwright ran; the index still lists the run.
        continue-on-error: true
        with:
          name: playwright-report
          path: site/runs/${{ github.run_id }}
      - run: node scripts/build-pages-site.mjs site
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
